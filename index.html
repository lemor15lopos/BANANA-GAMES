<style>

  /* --- 1a. Base y fondo --- */
  html, body {
    width: 100%;
    height: 100%;
  }
  body {
    overflow-y: hidden;
    margin: 0;

    /* Color de fondo (se ve si no hay imagen de fondo) */
    background-color: #1a1200;

    /* Imagen de fondo: se sobreescribe desde JS si CONFIG.backgroundImage tiene valor */
    background-image: linear-gradient(135deg, #1a1200 0%, #2d1f00 50%, #1a1200 100%);
    background-attachment: fixed;
    background-size: cover;
    background-position: center;

    font-family: 'Segoe UI', sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: #fff;
  }
  * {
    box-sizing: border-box !important;
    user-select: none !important;
    list-style-type: none !important;
  }
  *::selection {
    background-color: rgba(255, 210, 0, 0.4);
  }

  /* --- 1b. Caja genérica --- */
  .box {
    width: 100%;
    padding: 8px;
    background-color: rgba(20, 15, 0, 0.6);
    border: 2px solid rgba(255, 200, 0, 0.18);
    border-radius: 12px;
    box-shadow: 0 4px 12px 2px rgba(0, 0, 0, 0.5);
  }
  .boxTitle {
    display: flex;
    align-items: center;
    padding: 2px 4px 8px;
    color: #ffd700;
  }
  .boxTitle span {
    margin-left: 9px;
    color: #fff;
    font-size: 15px;
  }

  /* --- 1c. Lista de archivos --- */
  main {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    display: flex;
    flex-direction: column;
  }
  section.list {
    height: 392px;
    margin-bottom: 14px;
  }
  ul.items {
    display: flex;
    flex-direction: column;
    background-color: rgba(0, 0, 0, 0.4);
    border-radius: 6px;
    width: 100%;
    height: calc(100% - 34px);
    margin: 0;
    padding: 3px 3px 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #ffd700 transparent;
  }
  ul.items li {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 28px;
    margin-bottom: 3px;
    padding-left: 10px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.12s;
  }
  ul.items li:hover {
    background-color: rgba(255, 210, 0, 0.1);
  }
  ul.items li.selected {
    background-color: rgba(255, 210, 0, 0.2);
    border-left: 3px solid #ffd700;
  }

  /* Etiquetas de version y tipo en cada archivo */
  li .tag {
    background-color: rgba(255, 200, 0, 0.2);
    border-radius: 3px;
    font-size: 10px;
    font-weight: 400;
    padding: 1px 5px;
    margin-left: 6px;
    color: #ffd700;
    pointer-events: none;
  }
  li .vtag {
    background-color: rgba(255, 210, 0, 0.85);
    color: #1a1000 !important;
    font-weight: 700;
  }

  /* --- 1d. Botones de descarga --- */
  section.downloads .downloadButtons {
    display: flex;
    height: 34px;
    gap: 6px;
  }
  .downloadButtons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 34px;
    font-size: 13px;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: rgba(255, 180, 0, 0.25);
    border: 1px solid rgba(255, 200, 0, 0.3);
    transition: background 0.15s;
  }
  .downloadButtons a:hover  { background-color: rgba(255, 180, 0, 0.4); }
  .downloadButtons a:active { background-color: rgba(255, 180, 0, 0.15); outline: 2px solid rgba(255, 200, 0, 0.6); }

  /* --- 1e. Buscador --- */
  .search {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    display: flex;
    gap: 6px;
    padding: 6px;
    background-color: rgba(20, 15, 0, 0.7);
    border: 2px solid rgba(255, 200, 0, 0.18);
    border-radius: 10px;
  }
  input {
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: 500;
  }
  .search #bananasearch { width: 285px; }

  /* --- 1f. Sidebar izquierdo --- */
  aside.left {
    position: absolute;
    top: 0;
    left: 0;
    height: 100vh;
    padding: 12px;
    pointer-events: none;
  }
  aside.left * { pointer-events: auto; }
  aside.left .box { width: 190px; border-radius: 10px; }

  /* Logo */
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px 14px;
    border-bottom: 1px solid rgba(255, 200, 0, 0.2);
    margin-bottom: 6px;
  }
  .brand-logo img {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
  }
  .brand-icon-fallback {
    font-size: 28px;
    filter: drop-shadow(0 2px 4px rgba(255, 200, 0, 0.5));
  }
  .brand-text .name { font-size: 15px; font-weight: 700; color: #ffd700; letter-spacing: 0.03em; }
  .brand-text .sub  { font-size: 10px; color: rgba(255, 200, 0, 0.5); margin-top: 1px; }

  /* Sección y botones de categoría */
  .sidebar-section-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255, 200, 0, 0.4);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 4px 4px;
  }
  aside.left .categories { display: flex; flex-direction: column; padding: 2px 2px 0; }
  ul.categories li {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    margin-bottom: 3px;
    padding: 0 8px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.75);
    transition: background 0.12s;
  }
  ul.categories li:hover    { background-color: rgba(255, 200, 0, 0.12); color: #fff; }
  ul.categories li.selected { background-color: rgba(255, 200, 0, 0.25); color: #ffd700; border-left: 3px solid #ffd700; }
  .cat-icon  { font-size: 14px; width: 18px; text-align: center; }
  .cat-count { margin-left: auto; background: rgba(255, 200, 0, 0.15); color: rgba(255, 200, 0, 0.8); font-size: 10px; padding: 1px 6px; border-radius: 8px; }

  /* Caja de info inferior del sidebar */
  aside.left .bottom { position: absolute; bottom: 12px; }
  aside article.box  { padding: 8px 12px; }
  aside article.box * { margin: 0; font-size: 13px; font-weight: 400; }
  aside article.box h1 { margin-bottom: 8px; text-align: center; font-size: 14px; font-weight: 600; color: #ffd700; }

  /* --- 1g. Sidebar derecho --- */
  aside.right {
    display: flex;
    flex-direction: column;
    position: absolute;
    bottom: 0;
    right: 0;
    padding: 12px;
    pointer-events: none;
  }
  aside.right * { pointer-events: auto; }
  aside.right .box { margin-top: 12px; width: auto; align-self: flex-end; border-radius: 8px; padding: 4px; display: flex; gap: 4px; }
  aside.right button {
    width: 48px;
    height: 32px;
    border: none;
    background: none;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffd700; font-size: 18px; transition: background 0.12s;
  }
  aside.right button:hover { background-color: rgba(255, 200, 0, 0.15); }

  /* --- 1h. Overlay --- */
  #overlay {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: absolute;
    width: vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    z-index: 11;
  }
  #overlay .title { display: flex; justify-content: space-between; align-items: center; width: 600px; font-size: 20px; margin-bottom: 12px; color: #ffd700; }
  .title button { width: 28px; height: 28px; border: none; background: rgba(255, 200, 0, 0.15); border-radius: 5px; cursor: pointer; color: #ffd700; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .title button:hover { background: rgba(255, 200, 0, 0.3); }
  #overlay article { width: 640px; max-height: 85vh; padding: 0 20px 36px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #ffd700 transparent; }
  #overlay article * { user-select: text !important; }
  #overlay article h1 { font-size: 30px; text-align: center; margin-bottom: 14px; color: #ffd700; }
  #overlay article p  { font-weight: 400; margin: 8px 0; color: rgba(255,255,255,0.85); }
  #overlay article a  { color: #ffd700; font-weight: 600; }

  /* --- 1i. Pie de página --- */
  .dmca { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: 0.4; text-shadow: 0 0 8px #000; color: #ffd700; }

  /* --- 1j. Scrollbar personalizada --- */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: none; }
  ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #ffaa00; }

  /* --- 1k. Colores de botones por plataforma --- */
  .mediafire      { background-color: rgba(  0, 119, 255, 0.5)  !important; }
  .mediafire:hover{ background-color: rgba(  0, 119, 255, 0.35) !important; }
  .gofile         { background-color: rgba(255, 200,   0, 0.4)  !important; color: #000 !important; font-weight: 600; }
  .gofile:hover   { background-color: rgba(255, 200,   0, 0.25) !important; }

  .mega:hover     { background-color: rgba(221,  20,   5, 0.35) !important; }
  .torrent        { background-color: rgba(100, 200,  50, 0.4)  !important; }
  .torrent:hover  { background-color: rgba(100, 200,  50, 0.25) !important; }
  .drive          { background-color: rgba(12, 230, 12, 0.5)  !important; }
  .drive:hover    { background-color: rgba(11, 135, 11, 0.35) !important; }
  .romsfun        { background-color: rgba(255, 0, 208, 0.6)  !important; }
  .romsfun:hover  { background-color: rgba(69, 5, 82, 0.4)  !important; }
  .github         { background-color: rgba(7, 129, 236, 0.4)  !important; }
  .github:hover   { background-color: rgba(13, 7, 129, 0.4)  !important; }
  .play           { background-color: rgba(12, 230, 12, 0.5)  !important; }
  .play:hover     { background-color: rgba(12, 230, 12, 0.5)  !important; }

  /* --- 1l. Responsive --- */
  @media (max-height: 600px) {
    aside article.box, .search, .dmca { display: none !important; }
  }
  @media (orientation: portrait), (max-width: 720px) {
    body { overflow-y: scroll; }
    main { top: calc(50vh - 30px); width: calc(100vw - 24px); }
    section.list { height: calc(100vh - 290px) !important; }
    aside.right { display: none; }
    aside.left { width: 100vw; }
    aside article.box { display: none !important; }
    aside.left .categories { flex-direction: row; overflow-x: auto; width: calc(100vw - 24px); scrollbar-width: thin; position: absolute; top: calc(100vh - 58px); }
    ul.categories li { padding: 0 10px; min-width: fit-content; }
    .cat-count, .cat-icon { display: none; }
    .search { width: calc(100vw - 24px); position: absolute; top: calc(100vh - 112px); padding: 4px 8px; align-items: center; }
    .search #bananasearch { height: 38px; width: 100%; font-size: 16px; }
    aside.left .bottom { position: absolute; top: 18px; right: 12px; height: 32px; }
    #overlay article { width: calc(100vw - 24px); }
    #overlay .title  { width: calc(100vw - 44px); }
  }

</style>

if (CONFIG.backgroundImage) {
  document.body.style.backgroundImage = "url('" + CONFIG.backgroundImage + "')";
}

var brandLogoEl = document.getElementById("brandLogo");
if (CONFIG.logoType === "image" && CONFIG.logo) {
  var logoImg = document.createElement("img");
  logoImg.src = CONFIG.logo;
  logoImg.alt = CONFIG.siteName;
  brandLogoEl.appendChild(logoImg);
} else {
  var logoIcon = document.createElement("div");
  logoIcon.className = "brand-icon-fallback";
  logoIcon.textContent = CONFIG.logo || "🍌";
  brandLogoEl.appendChild(logoIcon);
}
var brandTextEl = document.createElement("div");
brandTextEl.className = "brand-text";
brandTextEl.innerHTML = '<div class="name">' + CONFIG.siteName + '</div><div class="sub">' + CONFIG.siteTagline + '</div>';
brandLogoEl.appendChild(brandTextEl);

document.getElementById("infoBox").innerHTML =
  '<h1>' + CONFIG.infoTitle + '</h1>' +
  '<span style="font-size:12px;color:rgba(255,255,255,.7)">' + CONFIG.infoText + '</span>';

document.getElementById("footerText").textContent = CONFIG.footerText;

var socialEl = document.getElementById("socialButtons");
CONFIG.socialLinks.forEach(function(s) {
  var btn = document.createElement("button");
  btn.textContent = s.icon;
  btn.title = s.tip || "";
  btn.onclick = function() { window.open(s.url, "_blank"); };
  socialEl.appendChild(btn);
});

var categoryListEl  = document.getElementById("categoryList");
var itemListEl      = document.getElementById("itemList");
var downloadBtnsEl  = document.getElementById("downloadButtons");
var categoryTitleEl = document.getElementById("categoryTitle");
var searchInput     = document.getElementById("bananasearch");
var currentCategory = undefined;
var selectedItem    = undefined;

CONFIG.categories.forEach(function(cat, idx) {
  var li    = document.createElement("li");
  var icon  = document.createElement("span"); icon.className  = "cat-icon";  icon.textContent  = cat.icon;
  var label = document.createElement("span"); label.textContent = cat.title;
  var badge = document.createElement("span"); badge.className = "cat-count"; badge.textContent = cat.items.length;
  li.appendChild(icon); li.appendChild(label); li.appendChild(badge);
  li.addEventListener("click", (function(i) { return function() { changeCategory(i); }; })(idx));
  categoryListEl.appendChild(li);
});

function changeCategory(idx) {
  if (idx === currentCategory) return;
  searchInput.value = "";
  if (currentCategory !== undefined)
    categoryListEl.children[currentCategory].classList.remove("selected");
  categoryListEl.children[idx].classList.add("selected");
  categoryTitleEl.textContent = CONFIG.categories[idx].title;
  currentCategory = idx;
  selectedItem = undefined;
  renderItems(CONFIG.categories[idx].items);
  if (CONFIG.categories[idx].items.length > 0)
    selectItem(CONFIG.categories[idx].items[0], 0);
}

function renderItems(items) {
  itemListEl.innerHTML = "";
  downloadBtnsEl.innerHTML = "";
  items.forEach(function(item, i) {
    var li = document.createElement("li");
    li.textContent = item.name;
    if (item.vtag) { var vt = document.createElement("span"); vt.className = "tag vtag"; vt.textContent = item.vtag; li.appendChild(vt); }
    if (item.tag)  { var tg = document.createElement("span"); tg.className = "tag";      tg.textContent = item.tag;  li.appendChild(tg); }
    li.addEventListener("click", (function(it, idx) { return function() { selectItem(it, idx); }; })(item, i));
    itemListEl.appendChild(li);
  });
}

function selectItem(item, idx) {
  if (idx === selectedItem) return;
  if (selectedItem !== undefined && itemListEl.children[selectedItem])
    itemListEl.children[selectedItem].classList.remove("selected");
  if (itemListEl.children[idx])
    itemListEl.children[idx].classList.add("selected");
  selectedItem = idx;
  downloadBtnsEl.innerHTML = "";
  if (!item.links || item.links.length === 0) return;
  item.links.forEach(function(url, i) {
    var a = document.createElement("a");
    a.textContent = (item.buttons && item.buttons[i]) ? item.buttons[i] : "Descargar";
    a.href = url;
    a.target = "_blank";
    a.draggable = false;
    var lbl = a.textContent.toLowerCase();
    if      (lbl.includes("mediafire")) a.className = "mediafire";
    else if (lbl.includes("gofile"))    a.className = "gofile";
    else if (lbl.includes("mega"))      a.className = "mega";
    else if (lbl.includes("torrent"))   a.className = "torrent";
    else if (lbl.includes("drive"))     a.className = "drive";
    else if (lbl.includes("romsfun"))   a.className = "romsfun";
    else if (lbl.includes("github"))   a.className = "github";
    else if (lbl.includes("play"))     a.className = "play";
    downloadBtnsEl.appendChild(a);
  });
}

searchInput.addEventListener("keyup", function() {
  var q = searchInput.value.trim().toLowerCase();
  if (!q) { if (currentCategory !== undefined) changeCategory(currentCategory); return; }
  var results = [];
  CONFIG.categories.forEach(function(cat) {
    cat.items.forEach(function(item) {
      if (item.name.toLowerCase().indexOf(q) !== -1) results.push(item);
    });
  });
  if (currentCategory !== undefined) {
    categoryListEl.children[currentCategory].classList.remove("selected");
    currentCategory = undefined;
  }
  selectedItem = undefined;
  categoryTitleEl.textContent = results.length > 0
    ? "Búsqueda: " + results.length + " resultado" + (results.length !== 1 ? "s" : "")
    : "Sin resultados";
  renderItems(results);
  if (results.length > 0) selectItem(results[0], 0);
  else downloadBtnsEl.innerHTML = "";
});

function openOverlay(title) {
  document.getElementById("overlay").style.display = "flex";
  document.getElementById("overlayTitle").textContent = title;
}
function closeOverlay() {
  document.getElementById("overlay").style.display = "none";
}

changeCategory(0);
